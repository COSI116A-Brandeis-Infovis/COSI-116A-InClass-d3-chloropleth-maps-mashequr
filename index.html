<!DOCTYPE html>
<!--
  COSI 116A: Information Visualization
  In-class programming: D3 map of U.S. state borders
  Author: Dylan Cashman
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>COSI 116A Map example, courtesy of Maptime Amsterdam meetup: Geopolitics, Borders &amp; D3.js!</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    svg {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    path {
      fill: none;
      stroke: black;
    }

    #boundary path {
      stroke-dasharray: 3 5;
    }
  </style>
</head>
<body>
  <svg>
    <g id="boundary"></g>
    <g id="states"></g>
  </svg>
	<h1>United States in <span id="year">1790</span></h1>

  <script src="static/colors.js"></script>
  <script src="js/renderMap.js"></script>
</body>
</html>
